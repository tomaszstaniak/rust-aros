# Paths are relative to this project directory: run cargo from here.
# Toolchain paths written by setup.sh (AROS_GCC, AROS_SDK for build scripts).
include = ["../../../aros-env.toml"]

[build]
target = "../../x86_64-aros.json"

[target.x86_64-aros]
runner = "../../tools/aros-qemu-run.py"

[unstable]
build-std = ["core", "alloc"]
json-target-spec = true
